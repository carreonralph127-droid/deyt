<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Date Invitation</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    .card {
      background: rgba(255,255,255,0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      animation: fadeIn 2s ease;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-30px);}
      to {opacity: 1; transform: translateY(0);}
    }
    h1 {
      color: #e75480;
      font-size: 2.5em;
      margin-bottom: 20px;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from {text-shadow: 0 0 10px #ff6f91;}
      to {text-shadow: 0 0 25px #ff1493;}
    }
    button {
      background: linear-gradient(45deg, #ff6f91, #ff9671);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
    }
    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #ff6f91;
    }
    #form {
      display: none;
      margin-top: 20px;
    }
    input {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="card">
    <h1>💖 hi baby girl rara date jan jan lang? 💖</h1>
    <button id="yesBtn">Yes!</button>
    <button id="noBtn">No</button>

    <div id="form">
      <p>iyown. kaylan ka free?</p>
      <input type="date" id="date"><br>
      <input type="time" id="time"><br>
      <button onclick="submitDate()">pindot baby</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const form = document.getElementById("form");

    noBtn.addEventListener("mouseover", () => {
  
      noBtn.style.position = "absolute";
      noBtn.style.top = Math.random() * (window.innerHeight - 50) + "px";
      noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
    });

    yesBtn.addEventListener("click", () => {
      form.style.display = "block";
    });

    function submitDate() {
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      alert(`Yay! Kita tayo on ${date} at ${time} 💕`);
      launchConfetti();
    }

  
    function launchConfetti() {
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const pieces = Array.from({length: 100}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        w: 10,
        h: 10,
        color: `hsl(${Math.random()*360},100%,50%)`,
        speed: Math.random() * 3 + 2
      }));
      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pieces.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x,p.y,p.w,p.h);
          p.y += p.speed;
          if(p.y > canvas.height) p.y = -10;
        });
        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>
</html>
